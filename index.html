if (e.key === 'Home') goToTOC();
if (e.key === 'Escape') closeModal();
if (e.key === 't' || e.key === 'T') { e.preventDefault(); toggleToolbar(); }
if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggleFocusMode(); }
});
function pushToSheet() {
console.group('🔍 DEBUG pushToSheet');
if (!APPS_SCRIPT_URL || !APPS_SCRIPT_URL.startsWith('https://script.google.com/')) {
console.error('❌ URL Apps Script tidak valid');
console.groupEnd();
alert('⚠️ URL Apps Script belum dikonfigurasi.');
return;
}
console.log('1️⃣ URL OK');
if (!confirm('☁️ Push semua data ke Google Sheet?\nData lokal akan diupload ke cloud.')) {
console.log('2️⃣ Dibatalkan user');
console.groupEnd();
return;
}
console.log('2️⃣ Confirmed');
try {
collectContent();
console.log('3️⃣ collectContent() OK, pages.length =', pages.length);
} catch(e) {
console.error('❌ collectContent error:', e);
console.groupEnd();
showStatus('❌ collectContent error: ' + e.message, 'error');
return;
}
showStatus('☁️ Mengupload data ke Sheet...', 'cloud');
console.log('4️⃣ Memulai fetch POST...');
fetch(APPS_SCRIPT_URL, {
method: 'POST',
mode: 'no-cors',
headers: { 'Content-Type': 'text/plain;charset=utf-8' },
body: JSON.stringify({
action: 'saveAll',
pages: pages.map((p, i) => ({
pageIdx: i,
title: p.title || '',
content: p.content || '',
caption: p.caption || '',
image: p.image || '',
isCover: !!p.isCover,
pageType: p.pageType || 'none',
linkImages: p.linkImages || [],
linkVideo: p.linkVideo || null
})),
timestamp: new Date().toISOString()
})
})
.then(() => {
console.log('5️⃣ Fetch BERHASIL');
showStatus('✅ BERHASIL! Data sudah tersimpan di Google Sheet', 'success');
console.groupEnd();
})
.catch(err => {
console.error('❌ Fetch ERROR:', err);
showStatus('❌ Gagal push: ' + err.message, 'error');
console.groupEnd();
});
}
</script>
